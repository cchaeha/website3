        <figure class="viz-player">
          <video id="replay" controls muted playsinline loop preload="metadata" poster="poster.webp?v=20261122-lab" width="1600" height="900" aria-label="Remnants of Ida" aria-describedby="replay-caption">

          </video>
          <div class="viz-tools"><a class="button" href="replay.mp4?v=20261122-lab" target="_blank" rel="noopener">Open video</a></div>
          <figcaption id="replay-caption" class="viz-caption">
            <p>Follow city-average rain, ambulance drive time to patients and the share of medical calls held during the storm.</p>
            <ul>
              <li><strong>Map:</strong> borough shading shows the change in median drive time over the preceding three hours, compared with the matching hours in six nearby weeks. Hatched boroughs have fewer than 15 calls in the window.</li>
              <li><strong>Call markers:</strong> positions are randomized within each call’s ZIP code. Rings mark held calls.</li>
              <li><strong>Rain:</strong> the hourly NLDAS-2 city average. Borough colors show drive time, rather than local rainfall.</li>
              <li><strong>Usual:</strong> the same clock hours one, two and three weeks before and after the event.</li>
            </ul>
            <p>These are observed records from one storm, rather than estimates of a causal effect.</p>
            <p class="viz-sources">Data: <a href="https://data.cityofnewyork.us/">NYC Open Data</a> (EMS incidents) and <a href="https://ldas.gsfc.nasa.gov/nldas">NASA NLDAS-2</a> (rainfall). Visualization: HUM.Lab.</p>
          </figcaption>
