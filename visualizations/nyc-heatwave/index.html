          <h1>The July 2013 heat wave</h1>
          <p>New York City · 11–24 July 2013</p>
        </header>
        <figure class="viz-player">
          <video id="heatwave" controls muted playsinline loop preload="metadata" poster="poster.webp" width="1600" height="900" aria-label="Hourly heat-wave replay" aria-describedby="heatwave-caption">
            <source src="heatwave.mp4" type="video/mp4">
            <a href="heatwave.mp4">Watch the heat-wave visualization</a>.
          </video>
          <div class="viz-tools"><a class="button" href="heatwave.mp4" target="_blank" rel="noopener">Open video</a></div>
          <figcaption id="heatwave-caption" class="viz-caption">
            <p>Follow air temperature, medical-call volume and calls held before an ambulance was assigned. The highlighted heat-wave window is 14–21 July.</p>
            <ul>
              <li><strong>Map:</strong> each dot represents one call in the preceding 24 hours. Dots are placed randomly within each call’s ZIP code.</li>
              <li><strong>Call volume:</strong> the preceding 24-hour count, expressed as a multiple of the 11–13 July daily average. The raw count appears underneath.</li>
              <li><strong>Calls held:</strong> the share of all calls held in the preceding 24 hours, with the study’s 12-year average for comparison.</li>
            </ul>
            <p>The call counts and held-call shares describe this episode. They do not estimate a causal effect of heat.</p>
            <p class="viz-sources">Data: <a href="https://data.cityofnewyork.us/">NYC Open Data</a> (EMS incidents) and <a href="https://ldas.gsfc.nasa.gov/nldas">NASA NLDAS-2</a> (air temperature). Visualization: HUM.Lab.</p>
          </figcaption>
        </figure>
