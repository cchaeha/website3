          <figcaption id="replay-caption" class="viz-caption">
            <p>Follow daily maximum temperature at Phoenix Sky Harbor and police calls in Phoenix, Mesa, Tempe, Chandler, Glendale and Gilbert.</p>
            <ul>
              <li><strong>Cards and call traces:</strong> counts over the preceding seven days, expressed as a multiple of the spring 2023 average. Raw counts appear underneath the headline multiples.</li>
              <li><strong>Map:</strong> calls reporting a death over the preceding 14 days in each city, relative to its spring average. Its time window differs from the seven-day cards and traces.</li>
              <li><strong>Temperature:</strong> the daily high at Sky Harbor. The highlighted interval marks the run of days at or above 110°F.</li>
            </ul>
            <p>These are police call records, not a count of heat deaths. They do not identify the cause of death or check-ins that occurred without a police call.</p>
            <p class="viz-sources">Data: the six cities’ public police-dispatch records and the Sky Harbor temperature series used in the presentation. Descriptive event replay; study in preparation. Visualization: HUM.Lab.</p>
